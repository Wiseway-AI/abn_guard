name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [staging, production]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    env:
      AWS_REGION: ap-southeast-2
      DEPLOY_ENV: ${{ github.ref_name == 'production' && 'prod' || 'qa' }}
      ECS_CLUSTER: ${{ github.ref_name == 'production' && 'prod-abn-guard' || 'qa-abn-guard' }}
      ECS_SERVICE: ${{ github.ref_name == 'production' && 'prod-abn-guard' || 'qa-abn-guard' }}
      ECS_TASK_FAMILY: ${{ github.ref_name == 'production' && 'prod-abn-guard' || 'qa-abn-guard' }}
      APP_URL: ${{ github.ref_name == 'production' && 'https://abn-guard.wiseway.ai' || 'https://qa-abn-guard.wiseway.ai' }}
      HEALTH_URL: ${{ github.ref_name == 'production' && 'https://origin.abn-guard.wiseway.ai' || 'https://qa-abn-guard.wiseway.ai' }}
      DESIRED_COUNT: ${{ github.ref_name == 'production' && '2' || '1' }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Validate public build configuration
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        shell: bash
        run: test -n "$CLERK_PUBLISHABLE_KEY"
      - name: Check immutable image
        id: image
        shell: bash
        run: |
          IMAGE_COUNT=$(aws ecr batch-get-image --repository-name abn-guard --image-ids imageTag="$GITHUB_SHA" --query 'length(images)' --output text)
          echo "exists=$([[ "$IMAGE_COUNT" == "1" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Build and push immutable ARM64 image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/abn-guard:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.APP_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Render task definition
        id: task
        shell: bash
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" --query taskDefinition > current-task.json
          jq --arg image "${{ steps.ecr.outputs.registry }}/abn-guard:${GITHUB_SHA}" \
            '.containerDefinitions[0].image=$image | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            current-task.json > next-task.json
          PREVIOUS_TASK=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          PREVIOUS_DESIRED_COUNT=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].desiredCount' --output text)
          NEXT_TASK=$(aws ecs register-task-definition --cli-input-json file://next-task.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "previous=$PREVIOUS_TASK" >> "$GITHUB_OUTPUT"
          echo "previous_desired_count=$PREVIOUS_DESIRED_COUNT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT_TASK" >> "$GITHUB_OUTPUT"
      - name: Run database migrations
        shell: bash
        run: |
          NETWORK=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].networkConfiguration' --output json)
          MIGRATION_TASK=$(aws ecs run-task --cluster "$ECS_CLUSTER" --task-definition "${{ steps.task.outputs.next }}" --launch-type FARGATE --network-configuration "$NETWORK" --overrides '{"containerOverrides":[{"name":"abn-guard","command":["node","scripts/migrate.mjs"]}]}' --query 'tasks[0].taskArn' --output text)
          test "$MIGRATION_TASK" != "None"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$MIGRATION_TASK"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$MIGRATION_TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          test "$EXIT_CODE" = "0"
      - name: Deploy and wait for rolling health gate
        id: rollout
        shell: bash
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "${{ steps.task.outputs.next }}" --desired-count "$DESIRED_COUNT" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "$HEALTH_URL/api/health"
      - name: Roll back failed deployment
        if: failure() && steps.task.outputs.previous != ''
        shell: bash
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "${{ steps.task.outputs.previous }}" --desired-count "${{ steps.task.outputs.previous_desired_count }}" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
