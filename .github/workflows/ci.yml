name: CI

on:
  pull_request:
    branches: [staging, production]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint -- --quiet
      - run: npm test
      - run: npx tsc --noEmit --pretty false
      - run: npm run build
      - name: Validate migrations
        run: |
          test -n "$(find drizzle-pg -maxdepth 1 -name '*.sql' -print -quit)"
          ! grep -RIE 'DROP[[:space:]]+(TABLE|DATABASE)|TRUNCATE' drizzle-pg

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: abn-guard:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: abn-guard:pr-${{ github.event.pull_request.number }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
